<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تعيين كلمة المرور الجديدة · الفيزياء مع أ. كريم</title>
<meta name="description" content="Itqan reset password screen with validation and match check.">
<meta name="theme-color" content="#FFC22E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 44 44%27%3E%3Crect x=%272%27 y=%272%27 width=%2740%27 height=%2740%27 rx=%2713%27 fill=%27%23FFC22E%27 stroke=%27%231A1712%27 stroke-width=%273%27/%3E%3Ccircle cx=%2722%27 cy=%2722%27 r=%274%27 fill=%27%231A1712%27/%3E%3Cellipse cx=%2722%27 cy=%2722%27 rx=%2713%27 ry=%275.5%27 fill=%27none%27 stroke=%27%231A1712%27 stroke-width=%272.4%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared/itqan.css">
<style>
  .auth-layout {
    min-height: calc(100vh - 80px); display: flex; align-items: center; justify-content: center;
    padding: 30px var(--gutter);
  }
  .reset-card {
    background: var(--paper); border: 3px solid var(--ink); border-radius: var(--r-panel);
    max-width: 520px; width: 100%; padding: clamp(28px, 4vw, 44px); box-shadow: var(--shadow-lift);
    display: grid; gap: 20px;
  }
  
  /* Demo bar */
  .demo-bar {
    position: fixed; bottom: 16px; inset-inline: 16px; max-width: 760px; margin: 0 auto;
    background: var(--ink); color: var(--paper); border-radius: 14px; padding: 10px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 100;
  }
  .demo-btns { display: flex; gap: 8px; }
  .demo-btns button {
    background: rgba(255,255,255,.15); color: #fff; border: 0; padding: 6px 12px; border-radius: 8px; font-size: 12.5px; cursor: pointer;
  }
  .demo-btns button[aria-pressed="true"] { background: var(--sun); color: var(--ink); font-weight: 700; }

  [data-state="success"] #reset-form { display: none; }
  [data-state="success"] #reset-success { display: grid !important; }
</style>
</head>
<body data-state="normal" data-title-en="Set New Password · Itqan">

<header class="topbar">
  <a class="brand" href="hero.html">
    <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true"><rect x="2" y="2" width="40" height="40" rx="13" fill="#FFC22E" stroke="#1A1712" stroke-width="2.5"/><circle cx="22" cy="22" r="3.4" fill="#1A1712"/><ellipse cx="22" cy="22" rx="13" ry="5.5" fill="none" stroke="#1A1712" stroke-width="2.2"/></svg>
    <span><span class="brand-name" data-en="Physics with Mr. Karim">الفيزياء مع أ. كريم</span><span class="brand-sub" data-en="Password Reset">إعادة التعيين</span></span>
  </a>
  <div class="topbar-actions"><button class="lang" type="button">English</button></div>
</header>

<main class="auth-layout">
  <div class="reset-card">
    
    <!-- Success view -->
    <div id="reset-success" style="display:none; text-align:center; gap:16px;">
      <div style="width:72px; height:72px; border-radius:50%; background:var(--mint); border:2.5px solid var(--ink); margin:0 auto; display:flex; align-items:center; justify-content:center; color:#fff; font-size:36px;">✓</div>
      <h2 style="font-size:24px; font-weight:800;" data-en="Password Changed Successfully!">تم تعيين كلمة المرور الجديدة بنجاح!</h2>
      <p style="color:var(--ink-2); font-size:15.5px;" data-en="Your password has been updated. You can now log in to your account.">
        تم تحديث بيانات الدخول بنجاح. يمكنك الآن تسجيل الدخول والمتابعة من حيث توقفت.
      </p>
      <a class="btn" href="login.html" style="justify-self:center; margin-top:10px;" data-en="Go to Login">تسجيل الدخول الآن ←</a>
    </div>

    <!-- Form view -->
    <form id="reset-form" data-fake="success" style="display:grid; gap:18px;">
      <div>
        <h1 style="font-size:26px; font-weight:800;" data-en="Create a Strong Password">عيّن كلمة سر جديدة لحسابك</h1>
        <p style="color:var(--ink-2); font-size:15px; margin-top:4px;" data-en="Enter at least 8 characters. Make sure it's memorable and secure.">
          اكتب كلمة مرور قوية تتكون من 8 خانات على الأقل تحتوي على حروف وأرقام.
        </p>
      </div>

      <div class="field">
        <label class="label" for="pw"><span data-en="New Password">كلمة المرور الجديدة</span></label>
        <div class="input-wrap">
          <input class="input" id="pw" type="password" required minlength="8" placeholder="••••••••">
          <button class="peek" type="button" aria-pressed="false" aria-label="إظهار كلمة السر"><svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>

      <div class="field">
        <label class="label" for="pw2"><span data-en="Confirm New Password">تأكيد كلمة المرور الجديدة</span></label>
        <div class="input-wrap">
          <input class="input" id="pw2" type="password" required minlength="8" data-match="pw" placeholder="••••••••" aria-describedby="err-pw2">
          <button class="peek" type="button" aria-pressed="false" aria-label="إظهار كلمة السر"><svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <p class="err" id="err-pw2"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#E9502E"/><path d="M8 4.5v4.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="11.3" r="1" fill="#fff"/></svg><span data-en="Passwords do not match">كلمتا السر غير متطابقتين</span></p>
      </div>

      <button class="btn btn-block" type="submit" data-en="Save & Update Password">تحديث كلمة المرور والدخول 🔒</button>
    </form>

  </div>
</main>

<script src="shared/itqan.js"></script>
</body>
</html>
