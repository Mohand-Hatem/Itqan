events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Security headers (docs/09 §2, step 10.2a). No version in the Server header.
    server_tokens off;

    # Access log without secrets (10R.9; CLAUDE.md: never log raw tokens). Invitation, consent,
    # verification and reset links carry one-time tokens in the query string or the path, so the
    # log keeps the path only, masks the reset token, and drops the query from the Referer.
    map $request_uri $loggable_uri {
        ~^/api/auth/reset-password/  "/api/auth/reset-password/[token]";
        ~^(?<path>[^?]*)             $path;
    }
    map $http_referer $loggable_referer {
        ~^(?<ref>[^?]*)              $ref;
        default                      "-";
    }
    log_format no_tokens '$remote_addr - $remote_user [$time_local] "$request_method $loggable_uri $server_protocol" '
                         '$status $body_bytes_sent "$loggable_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log no_tokens;
    # Add nosniff and Referrer-Policy only when the upstream did not (helmet sets them on
    # /api), so no response carries a header twice. An empty value means "not sent".
    map $upstream_http_x_content_type_options $sec_nosniff {
        ""      "nosniff";
        default "";
    }
    map $upstream_http_referrer_policy $sec_referrer {
        ""      "strict-origin-when-cross-origin";
        default "";
    }
    # WebSocket upgrade when asked for, otherwise no Connection header (keeps upstream keepalive).
    # Set once at server level: a location with its own proxy_set_header would drop all the
    # server-level forwarding headers (Host, X-Real-IP, X-Forwarded-*) (step 10.3).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    # web_upstream and api_upstream: containers (upstreams.conf) or host dev servers (upstreams.dev.conf).
    include /etc/nginx/upstreams.conf;

    server {
        listen 80;
        server_name _;

        # Shared proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Powered-By;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Security headers on every response, errors included.
        add_header X-Content-Type-Options $sec_nosniff always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # 1. Auth routes -> Next.js (/api/auth/*)
        location ^~ /api/auth/ {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
        }

        # 2. Real-time SSE stream -> NestJS (/api/sse with buffering disabled)
        location ^~ /api/sse {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 24h;
        }

        # 3. All other backend API endpoints -> NestJS (/api/*)
        location ^~ /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
        }

        # 4. Public pages, student portal, and Next.js assets -> Next.js
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
        }
    }
}
