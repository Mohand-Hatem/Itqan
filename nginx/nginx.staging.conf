events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Security headers (docs/09 §2, step 10.2a). No version in the Server header.
    server_tokens off;
    # Add nosniff and Referrer-Policy only when the upstream did not (helmet sets them on
    # /api), so no response carries a header twice. An empty value means "not sent".
    map $upstream_http_x_content_type_options $sec_nosniff {
        ""      "nosniff";
        default "";
    }
    map $upstream_http_referrer_policy $sec_referrer {
        ""      "strict-origin-when-cross-origin";
        default "";
    }
    # WebSocket upgrade when asked for, otherwise no Connection header (keeps upstream keepalive).
    # Set once at server level: a location with its own proxy_set_header would drop all the
    # server-level forwarding headers (Host, X-Real-IP, X-Forwarded-*) (step 10.3).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    upstream web_upstream {
        server web:3000;
        keepalive 32;
    }

    upstream api_upstream {
        server api:4000;
        keepalive 32;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS Staging Gateway (Cloudflare Origin CA Certificate)
    server {
        listen 443 ssl;
        server_name ~^(?<subdomain>.+)\.staging\.(?<domain>.+)$ staging.* localhost;

        ssl_certificate     /etc/nginx/certs/origin.crt;
        ssl_certificate_key /etc/nginx/certs/origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Real visitor IP from Cloudflare, so $remote_addr (and X-Real-IP, which Better Auth's rate
        # limits key on) is the visitor, not the edge. Ranges from https://www.cloudflare.com/ips/;
        # shortcut: hard-coded list, refresh it when setting up the VPS (step 10.8).
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        set_real_ip_from 2400:cb00::/32;
        set_real_ip_from 2606:4700::/32;
        set_real_ip_from 2803:f800::/32;
        set_real_ip_from 2405:b500::/32;
        set_real_ip_from 2405:8100::/32;
        set_real_ip_from 2a06:98c0::/29;
        set_real_ip_from 2c0f:f248::/32;
        real_ip_header CF-Connecting-IP;

        # Shared proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Powered-By;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Security headers on every response, errors included.
        add_header X-Content-Type-Options $sec_nosniff always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # HTTPS only: browsers keep to HTTPS for a year, tenant subdomains included.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 1. Auth routes -> Next.js (/api/auth/*)
        location ^~ /api/auth/ {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
        }

        # 2. Real-time SSE stream -> NestJS (/api/sse with buffering disabled)
        location ^~ /api/sse {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 24h;
        }

        # 2b. Same stream under its alias (step 10.2a): unbuffered too.
        location ^~ /api/notifications/stream {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 24h;
        }

        # 3. All other backend API endpoints -> NestJS (/api/*)
        location ^~ /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
        }

        # 4. Public pages, student portal, and Next.js assets -> Next.js
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
        }
    }
}
