# Upstreams for the dev gateway (docker-compose.dev.yml, 10R.8): the `npm run dev` servers on the
# host, so http://<slug>.localhost:8080 and http://admin.localhost:8080 serve one origin and
# Swagger's "Try it out" works with the session cookie. Development only.
upstream web_upstream {
    server host.docker.internal:3000;
    keepalive 32;
}

upstream api_upstream {
    server host.docker.internal:4000;
    keepalive 32;
}
