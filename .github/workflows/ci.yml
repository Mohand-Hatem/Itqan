name: CI

on:
  push:
    # Phase branches too, so each phase's push is checked before it reaches main (step 10.4).
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

# CI only reads the repository; it never pushes or publishes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Step 10.4: known-vulnerable dependencies and committed secrets fail the build.
  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history for the secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit production dependencies (no moderate or worse)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies (no high or critical)
        run: npm audit --audit-level=high

      - name: Scan the full git history for secrets (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2
          git /repo --redact --verbose --exit-code 1

  validate:
    name: Lint, Typecheck, Test, Build, Docker
    runs-on: ubuntu-latest

    # Integration tests need Postgres; same image, database and port as local Docker.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: itqan
          POSTGRES_PASSWORD: itqan
          POSTGRES_DB: itqan_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U itqan -d itqan_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://itqan:itqan@localhost:5433/itqan_test
      TEST_DATABASE_URL: postgresql://itqan:itqan@localhost:5433/itqan_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run tests (Vitest)
        run: npm test

      - name: Build applications and packages
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: itqan-web:test

      - name: Build Docker image for API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: itqan-api:test
