name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test, Build, Docker
    runs-on: ubuntu-latest

    # Integration tests need Postgres; same image, database and port as local Docker.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: itqan
          POSTGRES_PASSWORD: itqan
          POSTGRES_DB: itqan_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U itqan -d itqan_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://itqan:itqan@localhost:5433/itqan_test
      TEST_DATABASE_URL: postgresql://itqan:itqan@localhost:5433/itqan_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run tests (Vitest)
        run: npm test

      - name: Build applications and packages
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: itqan-web:test

      - name: Build Docker image for API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: itqan-api:test
