services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://itqan:itqan@postgres:5432/itqan}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:8080}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
    expose:
      - "3000"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://itqan:itqan@postgres:5432/itqan}
      - PLATFORM_ROOT_DOMAIN=${PLATFORM_ROOT_DOMAIN:-localhost}
    expose:
      - "4000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  # Local development and tests only (profile "local"): staging and production use Neon.
  # Same major version as the Neon project (Postgres 18). Postgres 18 images keep data under /var/lib/postgresql.
  postgres:
    image: postgres:18-alpine
    profiles: ["local"]
    environment:
      POSTGRES_USER: itqan
      POSTGRES_PASSWORD: itqan
      POSTGRES_DB: itqan
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itqan -d itqan"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
